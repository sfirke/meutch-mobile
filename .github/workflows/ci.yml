name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Flag dependency additions and version changes
        env:
          # Read through the environment so the body is never interpolated
          # into the shell command.
          DEPENDENCY_CHANGE_ACK: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-dependency-changes.mjs "origin/$BASE_REF"
